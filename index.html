<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Blocks every request except to this same local server, so nothing can leave the page. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; worker-src blob: 'self'; connect-src 'self'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Translate (offline)</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff; --surface: #ffffff; --surface-alt: #f8f9fa;
  --text: #202124; --muted: #5f6368; --line: #dadce0;
  --accent: #1a73e8; --accent-bg: #e8f0fe; --hover: rgba(60, 64, 67, 0.08);
  --focus: rgba(26, 115, 232, 0.35);
  --font: "Google Sans", Roboto, "Segoe UI", system-ui, -apple-system, "Noto Sans", "Noto Sans Malayalam", "Noto Sans Devanagari", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #202124; --surface: #2d2e31; --surface-alt: #292a2d;
    --text: #e8eaed; --muted: #9aa0a6; --line: #5f6368;
    --accent: #8ab4f8; --accent-bg: #394457; --hover: rgba(232, 234, 237, 0.1);
    --focus: rgba(138, 180, 248, 0.45);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.5; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--line); }
header svg { width: 28px; height: 28px; fill: var(--accent); }
header h1 { margin: 0; font-size: 22px; font-weight: 400; }
.badge { margin-left: auto; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 12px; padding: 2px 10px; }
main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 40px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.langbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; border-bottom: 1px solid var(--line); padding: 4px 8px; }
.langbar .right { justify-self: start; }
select { appearance: auto; border: 0; background: transparent; color: var(--accent); font: inherit; font-weight: 500; padding: 8px 10px; border-radius: 4px; cursor: pointer; max-width: 100%; }
select:hover { background: var(--accent-bg); }
select option { color: var(--text); background: var(--surface); }
button { font: inherit; color: var(--muted); background: transparent; border: 0; cursor: pointer; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
.icon-btn svg { width: 22px; height: 22px; fill: currentColor; }
.icon-btn:hover:not(:disabled) { background: var(--hover); }
.icon-btn:disabled { opacity: 0.4; cursor: default; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
textarea:focus-visible { outline: none; }
.panes { display: grid; grid-template-columns: 1fr 1fr; }
.pane { position: relative; min-height: 280px; display: flex; flex-direction: column; }
.pane + .pane { background: var(--surface-alt); border-left: 1px solid var(--line); }
textarea, .output { flex: 1; width: 100%; min-height: 220px; padding: 16px 48px 8px; font: inherit; font-size: 24px; line-height: 1.4; color: var(--text); background: transparent; border: 0; resize: none; white-space: pre-wrap; overflow-wrap: anywhere; }
textarea::placeholder { color: var(--muted); }
.output.empty { color: var(--muted); font-size: 18px; }
.pane-foot { display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 8px 0 16px; font-size: 12px; color: var(--muted); }
.clear { position: absolute; top: 8px; right: 8px; }
.clear[hidden] { display: none; }
.status { min-height: 18px; font-size: 13px; }
.error { color: #d93025; }
@media (prefers-color-scheme: dark) { .error { color: #f28b82; } }
.notice { display: none; margin: 0 0 16px; padding: 12px 16px; border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 4px; background: var(--surface-alt); }
.notice pre { margin: 8px 0 0; padding: 10px 12px; overflow-x: auto; background: var(--hover); border-radius: 4px; font-size: 13px; }
.notice code { background: var(--hover); padding: 2px 6px; border-radius: 4px; }
.privacy { margin-top: 16px; text-align: center; font-size: 13px; color: var(--muted); }
@media (max-width: 720px) {
  .panes { grid-template-columns: 1fr; }
  .pane + .pane { border-left: 0; border-top: 1px solid var(--line); }
  textarea, .output { font-size: 20px; min-height: 160px; }
  .pane { min-height: 200px; }
  header { padding: 12px 16px; }
}
@media (prefers-reduced-motion: no-preference) { select, .icon-btn { transition: background 0.15s; } }
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0014.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg>
  <h1>Translate</h1>
  <span class="badge">Offline, in your browser</span>
</header>

<main>
  <div class="notice" id="notice"></div>

  <div class="card" id="card">
    <div class="langbar">
      <select id="src" aria-label="Translate from"></select>
      <button class="icon-btn" id="swap" title="Swap languages" aria-label="Swap languages">
        <svg viewBox="0 0 24 24"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
      </button>
      <select id="dst" class="right" aria-label="Translate to"></select>
    </div>

    <div class="panes">
      <section class="pane">
        <textarea id="input" dir="auto" maxlength="5000" placeholder="Enter text"
          autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
          aria-label="Text to translate"></textarea>
        <button class="icon-btn clear" id="clear" title="Clear text" aria-label="Clear text" hidden>
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
        <div class="pane-foot"><span id="count">0 / 5000</span></div>
      </section>

      <section class="pane">
        <div class="output empty" id="output" dir="auto" aria-live="polite">Translation</div>
        <div class="pane-foot">
          <span class="status" id="status"></span>
          <button class="icon-btn" id="copy" title="Copy translation" aria-label="Copy translation" disabled>
            <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
          </button>
        </div>
      </section>
    </div>
  </div>

  <p class="privacy">Translation runs entirely in this browser tab. Nothing is saved or sent anywhere.</p>
</main>

<!-- Translation engine. Runs in a background thread so the page stays responsive. -->
<script type="text/plain" id="worker-src">
import { pipeline, env } from "__LIB__";

env.allowLocalModels = true;
env.allowRemoteModels = false;          // never fetch from the internet
env.localModelPath = "__BASE__models/";
env.useBrowserCache = false;            // do not store anything in the browser
env.backends.onnx.wasm.wasmPaths = "__BASE__lib/";
env.backends.onnx.wasm.numThreads = 1;  // no cross-origin isolation needed

var MODEL = "Xenova/nllb-200-distilled-600M";
var tr = null, latest = 0, chain = Promise.resolve();

self.onmessage = function (e) {
  var m = e.data;
  if (m.type === "load") {
    chain = chain.then(load);
  } else if (m.type === "translate") {
    latest = m.id;
    chain = chain.then(function () { return job(m); });
  }
};

async function load() {
  try {
    tr = await pipeline("translation", MODEL, { quantized: true });
    self.postMessage({ type: "ready" });
  } catch (err) {
    self.postMessage({ type: "fatal", message: String((err && err.message) || err) });
  }
}

async function job(m) {
  if (m.id !== latest) return;
  try {
    var lines = m.text.split("\n"), out = [];
    for (var i = 0; i < lines.length; i++) {
      if (m.id !== latest) return;      // newer text arrived, drop this job
      if (!lines[i].trim()) { out.push(lines[i]); continue; }
      var r = await tr(lines[i], { src_lang: m.from, tgt_lang: m.to, max_new_tokens: 400 });
      out.push(r[0].translation_text);
    }
    self.postMessage({ type: "result", id: m.id, text: out.join("\n") });
  } catch (err) {
    self.postMessage({ type: "error", id: m.id, message: String((err && err.message) || err) });
  }
}
</script>

<script>
(function () {
  "use strict";
  // [short code, display name, NLLB code]. Add more from the NLLB-200 language list if you like.
  var LANGS = [
    ["ar", "Arabic", "arb_Arab"], ["bn", "Bengali", "ben_Beng"], ["zh", "Chinese (Simplified)", "zho_Hans"],
    ["cs", "Czech", "ces_Latn"], ["nl", "Dutch", "nld_Latn"], ["en", "English", "eng_Latn"],
    ["fr", "French", "fra_Latn"], ["de", "German", "deu_Latn"], ["el", "Greek", "ell_Grek"],
    ["gu", "Gujarati", "guj_Gujr"], ["he", "Hebrew", "heb_Hebr"], ["hi", "Hindi", "hin_Deva"],
    ["id", "Indonesian", "ind_Latn"], ["it", "Italian", "ita_Latn"], ["ja", "Japanese", "jpn_Jpan"],
    ["kn", "Kannada", "kan_Knda"], ["ko", "Korean", "kor_Hang"], ["ml", "Malayalam", "mal_Mlym"],
    ["mr", "Marathi", "mar_Deva"], ["ne", "Nepali", "npi_Deva"], ["fa", "Persian", "pes_Arab"],
    ["pl", "Polish", "pol_Latn"], ["pt", "Portuguese", "por_Latn"], ["pa", "Punjabi", "pan_Guru"],
    ["ro", "Romanian", "ron_Latn"], ["ru", "Russian", "rus_Cyrl"], ["si", "Sinhala", "sin_Sinh"],
    ["es", "Spanish", "spa_Latn"], ["sw", "Swahili", "swh_Latn"], ["sv", "Swedish", "swe_Latn"],
    ["ta", "Tamil", "tam_Taml"], ["te", "Telugu", "tel_Telu"], ["th", "Thai", "tha_Thai"],
    ["tr", "Turkish", "tur_Latn"], ["uk", "Ukrainian", "ukr_Cyrl"], ["ur", "Urdu", "urd_Arab"],
    ["vi", "Vietnamese", "vie_Latn"]
  ];
  var MODEL_DIR = "models/Xenova/nllb-200-distilled-600M/";

  var $ = function (id) { return document.getElementById(id); };
  var src = $("src"), dst = $("dst"), input = $("input"), output = $("output");
  var status = $("status"), count = $("count"), clearBtn = $("clear");
  var copyBtn = $("copy"), swapBtn = $("swap"), notice = $("notice");

  var worker = null, ready = false, reqId = 0, timer = null, translated = "";

  function codeOf(short) {
    for (var i = 0; i < LANGS.length; i++) if (LANGS[i][0] === short) return LANGS[i][2];
    return null;
  }

  function fill(select, value) {
    LANGS.forEach(function (l) {
      var o = document.createElement("option");
      o.value = l[0]; o.textContent = l[1];
      select.appendChild(o);
    });
    select.value = value;
  }

  function setStatus(text, isError) {
    status.textContent = text || "";
    status.className = isError ? "status error" : "status";
  }

  function setOutput(text) {
    translated = text || "";
    if (translated) { output.textContent = translated; output.className = "output"; }
    else { output.textContent = "Translation"; output.className = "output empty"; }
    output.lang = dst.value;
    copyBtn.disabled = !translated;
  }

  function run() {
    var text = input.value;
    var id = ++reqId;
    if (!text.trim()) { setOutput(""); setStatus(""); return; }
    if (!ready) { setStatus("Loading translation model…"); return; }
    setStatus("Translating…");
    worker.postMessage({ type: "translate", id: id, text: text, from: codeOf(src.value), to: codeOf(dst.value) });
  }

  function schedule() { clearTimeout(timer); timer = setTimeout(run, 350); }

  function onInput() {
    count.textContent = input.value.length + " / 5000";
    clearBtn.hidden = !input.value;
    input.lang = src.value;
    schedule();
  }

  function updateSwap() { swapBtn.disabled = src.value === dst.value; }

  input.addEventListener("input", onInput);
  clearBtn.addEventListener("click", function () { input.value = ""; onInput(); input.focus(); });
  src.addEventListener("change", function () { input.lang = src.value; updateSwap(); schedule(); });
  dst.addEventListener("change", function () { updateSwap(); schedule(); });

  swapBtn.addEventListener("click", function () {
    var a = src.value, b = dst.value, moved = translated;
    src.value = b; dst.value = a;
    if (moved) input.value = moved;
    onInput();
  });

  copyBtn.addEventListener("click", async function () {
    if (!translated) return;
    try {
      await navigator.clipboard.writeText(translated);
      setStatus("Copied");
      setTimeout(function () { if (status.textContent === "Copied") setStatus(""); }, 1500);
    } catch (e) {
      setStatus("Could not copy. Select the text and copy it manually.", true);
    }
  });

  var SETUP = "<p>The translation files are not downloaded yet. Close this page, then run this once in the folder that contains <code>index.html</code> (internet needed for the first run only):</p>" +
    "<pre>python start.py</pre>";

  function showNotice(html) { notice.innerHTML = html; notice.style.display = "block"; }

  function startWorker() {
    var base = new URL("./", location.href).href;
    var lib = new URL("lib/transformers.min.js", location.href).href;
    var code = $("worker-src").textContent
      .replace("__LIB__", function () { return lib; })
      .replace(/__BASE__/g, function () { return base; });
    var url = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
    worker = new Worker(url, { type: "module" });
    worker.onmessage = function (e) {
      var m = e.data;
      if (m.type === "ready") {
        ready = true; setStatus("");
        if (input.value.trim()) run();
      } else if (m.type === "result") {
        if (m.id !== reqId) return;
        setOutput(m.text); setStatus("");
      } else if (m.type === "error") {
        if (m.id !== reqId) return;
        setOutput(""); setStatus(m.message || "Translation failed.", true);
      } else if (m.type === "fatal") {
        setStatus("");
        showNotice("<p>Could not load the translation model: " + String(m.message).replace(/[<>&]/g, "") + "</p>" + SETUP);
      }
    };
    worker.onerror = function () {
      showNotice("<p>The translation engine could not start. Open this page through a local server (not by double-clicking the file).</p>" + SETUP);
    };
    worker.postMessage({ type: "load" });
  }

  async function init() {
    fill(src, "en");
    fill(dst, "ml");
    updateSwap();
    input.lang = src.value;
    if (location.protocol === "file:") {
      showNotice("<p>Browsers block local model files when a page is opened directly. Run this in the folder that contains <code>index.html</code> instead:</p><pre>python start.py</pre>");
      return;
    }
    try {
      var a = await fetch(MODEL_DIR + "config.json", { cache: "no-store" });
      var b = await fetch("lib/transformers.min.js", { method: "HEAD", cache: "no-store" });
      if (!a.ok || !b.ok) throw new Error("missing");
    } catch (e) {
      showNotice(SETUP);
      return;
    }
    setStatus("Loading translation model…");
    startWorker();
    input.focus();
  }

  init();
})();
</script>
</body>
</html>
